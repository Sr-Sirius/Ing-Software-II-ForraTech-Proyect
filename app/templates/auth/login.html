{% extends "base.html" %}

{% block body_class %}auth-bg{% endblock %}

{% block content %}

<link rel="stylesheet" href="{{ url_for('static', filename='css/pages/login.css') }}">

<div class="login-container">

    <div class="card">

        <div class="hero">
            <div class="bg"></div>
        </div>

        <form method="POST">

            <h2>ForraTech 🌱</h2>
            <h3>Login to your account</h3>

            <input 
                type="text"
                name="email"
                placeholder="Email or Username"
                required
            >

            <input 
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <div class="login-options">

                <label class="remember">
                    <input type="checkbox">
                    Remember me
                </label>

                <a href="{{ url_for('auth.forgot_password') }}" class="forgot">
                    Forgot password?
                </a>

            </div>

            <button type="submit">Login</button>

            <p class="register-link">
                Don't have an account?
                <a href="{{ url_for('auth.register') }}">Sign up</a>
            </p>

        </form>

    </div>

</div>

{% endblock %}
